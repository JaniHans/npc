<svg width="80" height="160" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated;">
  <!-- Blue Wizard - Facing Right (0, 0) -->
  <g id="blue-right">
    <!-- Shadow -->
    <ellipse cx="20" cy="35" rx="7" ry="2" fill="rgba(0,0,0,0.3)"/>
    <!-- Hat -->
    <polygon points="20,5 14,15 26,15" fill="hsl(240, 80%, 30%)"/>
    <rect x="12" y="14" width="16" height="3" fill="hsl(240, 70%, 25%)"/>
    <!-- Head -->
    <circle cx="20" cy="20" r="5" fill="#ffdbac"/>
    <!-- Eyes -->
    <rect x="18" y="19" width="2" height="2" fill="#000"/>
    <rect x="22" y="19" width="2" height="2" fill="#000"/>
    <!-- Beard -->
    <polygon points="16,23 15,28 20,26 25,28 24,23" fill="#ddd"/>
    <!-- Robe -->
    <polygon points="20,24 12,26 14,36 26,36 28,26" fill="hsl(240, 70%, 50%)"/>
    <!-- Staff -->
    <line x1="10" y1="20" x2="10" y2="34" stroke="#8b4513" stroke-width="2.5"/>
    <circle cx="10" cy="18" r="3" fill="hsl(60, 80%, 60%)"/>
    <circle cx="10" cy="18" r="1.5" fill="hsl(60, 80%, 80%)"/>
    <!-- Arm -->
    <line x1="16" y1="26" x2="10" y2="22" stroke="#ffdbac" stroke-width="2.5"/>
  </g>
  
